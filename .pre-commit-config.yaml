repos:
  # 1. General Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'tsconfig.*\.json'
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # 2. Python Backend: Ruff (Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 3. Python Backend: Mypy (Type Checking via local venv)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: backend/venv/bin/mypy backend
        language: system
        types: [python]
        pass_filenames: false

  # 4. Frontend & Monorepo: Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]
